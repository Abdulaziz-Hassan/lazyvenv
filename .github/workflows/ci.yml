name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --python ${{ matrix.python-version }}

      - run: uv run pytest

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --python 3.13

      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv build

      - name: Validate the distribution metadata
        run: uvx twine check dist/*

      - name: Smoke-test the built wheel
        run: |
          uv venv /tmp/smoke --python 3.13
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/lazyvenv --version
          /tmp/smoke/bin/python -m lazyvenv --version
